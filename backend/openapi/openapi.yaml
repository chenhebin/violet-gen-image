openapi: 3.1.0
info:
  title: Yingyan Platform API
  version: 0.1.0
  description: |
    映研用户端、管理端与 Worker 共用的 HTTP 契约。
    所有 JSON 成功响应均为 `{ code: 0, data }`，失败响应均为
    `{ code, message, details? }`。素材地址均为短期签名地址。
servers:
  - url: http://127.0.0.1:8080
    description: Local API
tags:
  - name: Health
  - name: User Auth
  - name: User
  - name: Generation
  - name: Retouch
  - name: Manage Auth
  - name: Manage Redemption
  - name: Manage AI
  - name: Manage Users
  - name: Manage Content
  - name: Manage Retouch
  - name: Manage Audit

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "503":
          $ref: "#/components/responses/Error"

  /api/auth/register:
    post:
      tags: [User Auth]
      operationId: registerUser
      requestBody:
        $ref: "#/components/requestBodies/UserRegister"
      responses:
        "201":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      tags: [User Auth]
      operationId: loginUser
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/session:
    get:
      tags: [User Auth]
      operationId: getUserSession
      security:
        - userSession: []
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Error"
  /api/auth/logout:
    post:
      tags: [User Auth]
      operationId: logoutUser
      security:
        - userSession: []
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "401":
          $ref: "#/components/responses/Error"

  /api/me:
    get:
      tags: [User]
      operationId: getCurrentUser
      security:
        - userSession: []
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Error"
  /api/entitlements:
    get:
      tags: [User]
      operationId: getEntitlement
      security:
        - userSession: []
      responses:
        "200":
          $ref: "#/components/responses/Entitlement"
        "401":
          $ref: "#/components/responses/Error"
  /api/usage/ledger:
    get:
      tags: [User]
      operationId: listUserLedger
      security:
        - userSession: []
      responses:
        "200":
          description: 用户次数流水
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerListSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /api/usage/quote:
    post:
      tags: [User]
      operationId: quoteGeneration
      security:
        - userSession: []
      requestBody:
        $ref: "#/components/requestBodies/GenerationQuote"
      responses:
        "200":
          description: 次数报价
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationQuoteSuccess"
        "400":
          $ref: "#/components/responses/Error"
  /api/redemptions/claim:
    post:
      tags: [User]
      operationId: claimRedemptionCode
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RedemptionClaim"
      responses:
        "200":
          description: 兑换结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionClaimSuccess"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/assets:
    post:
      tags: [User]
      operationId: uploadUserAsset
      security:
        - userSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  $ref: "#/components/schemas/UserAssetKind"
                role:
                  $ref: "#/components/schemas/ReferenceRole"
      responses:
        "201":
          description: 上传后的素材
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSuccess"
        "400":
          $ref: "#/components/responses/Error"
  /api/assets/{assetId}:
    delete:
      tags: [User]
      operationId: deleteUserAsset
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/prompts/optimize:
    post:
      tags: [Generation]
      operationId: optimizePrompt
      security:
        - userSession: []
      requestBody:
        $ref: "#/components/requestBodies/PromptOptimize"
      responses:
        "200":
          $ref: "#/components/responses/PromptVersion"
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/prompts/confirm:
    post:
      tags: [Generation]
      operationId: confirmPrompt
      security:
        - userSession: []
      requestBody:
        $ref: "#/components/requestBodies/PromptConfirm"
      responses:
        "200":
          $ref: "#/components/responses/PromptVersion"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/generations:
    post:
      tags: [Generation]
      operationId: createGeneration
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/GenerationCreate"
      responses:
        "202":
          $ref: "#/components/responses/GenerationTask"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/tasks:
    get:
      tags: [Generation]
      operationId: listGenerationTasks
      security:
        - userSession: []
      responses:
        "200":
          description: 当前用户任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskListSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /api/tasks/{taskId}:
    get:
      tags: [Generation]
      operationId: getGenerationTask
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/GenerationTask"
        "404":
          $ref: "#/components/responses/Error"
  /api/tasks/{taskId}/cancel:
    post:
      tags: [Generation]
      operationId: cancelGenerationTask
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/GenerationTask"
        "409":
          $ref: "#/components/responses/Error"

  /api/retouch-tickets:
    get:
      tags: [Retouch]
      operationId: listUserRetouchTickets
      security:
        - userSession: []
      responses:
        "200":
          description: 当前用户人工工单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetouchTicketListSuccess"
  /api/retouch-tickets/{ticketId}:
    get:
      tags: [Retouch]
      operationId: getUserRetouchTicket
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          $ref: "#/components/responses/RetouchTicket"
        "404":
          $ref: "#/components/responses/Error"
  /api/tasks/{taskId}/retouch-tickets:
    post:
      tags: [Retouch]
      operationId: createRetouchTicket
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RetouchCreate"
      responses:
        "201":
          $ref: "#/components/responses/RetouchTicket"
        "409":
          $ref: "#/components/responses/Error"
  /api/retouch-tickets/{ticketId}/quote/accept:
    post:
      tags: [Retouch]
      operationId: acceptRetouchQuote
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RetouchQuoteAccept"
      responses:
        "200":
          $ref: "#/components/responses/RetouchWithEntitlement"
        "409":
          $ref: "#/components/responses/Error"
  /api/retouch-tickets/{ticketId}/cancel:
    post:
      tags: [Retouch]
      operationId: cancelRetouchTicket
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/RetouchWithEntitlement"
        "409":
          $ref: "#/components/responses/Error"
  /api/retouch-tickets/{ticketId}/revisions:
    post:
      tags: [Retouch]
      operationId: requestRetouchRevision
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RetouchRevision"
      responses:
        "200":
          $ref: "#/components/responses/RetouchTicket"
        "409":
          $ref: "#/components/responses/Error"
  /api/retouch-tickets/{ticketId}/confirm:
    post:
      tags: [Retouch]
      operationId: confirmRetouchTicket
      security:
        - userSession: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/RetouchTicket"
        "409":
          $ref: "#/components/responses/Error"

  /api/manage/auth/login:
    post:
      tags: [Manage Auth]
      operationId: loginAdmin
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          $ref: "#/components/responses/AdminSession"
        "401":
          $ref: "#/components/responses/Error"
  /api/manage/auth/session:
    get:
      tags: [Manage Auth]
      operationId: getAdminSession
      security:
        - adminSession: []
      responses:
        "200":
          $ref: "#/components/responses/AdminSession"
        "401":
          $ref: "#/components/responses/Error"
  /api/manage/auth/logout:
    post:
      tags: [Manage Auth]
      operationId: logoutAdmin
      security:
        - adminSession: []
          csrfToken: []
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "403":
          $ref: "#/components/responses/Error"

  /api/manage/dashboard:
    get:
      tags: [Manage Content]
      operationId: getManageDashboard
      security:
        - adminSession: []
      responses:
        "200":
          $ref: "#/components/responses/ManageDashboard"
  /api/manage/audit-logs:
    get:
      tags: [Manage Audit]
      operationId: listAuditLogs
      x-permission: platform:manage
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: operatorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [success, failure] }
        - name: startAt
          in: query
          schema: { type: string, format: date-time }
        - name: endAt
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          $ref: "#/components/responses/ManageAuditPage"
        "403":
          $ref: "#/components/responses/Error"

  /api/manage/redemption-batches:
    get:
      tags: [Manage Redemption]
      operationId: listRedemptionBatches
      x-permission: platform:manage
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: productCode
          in: query
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/ManageRedemptionBatchPage"
    post:
      tags: [Manage Redemption]
      operationId: createRedemptionBatch
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RedemptionBatchCreate"
      responses:
        "201":
          $ref: "#/components/responses/ManageRedemptionBatchCreated"
        "409":
          $ref: "#/components/responses/Error"
  /api/manage/redemption-batches/{batchId}:
    get:
      tags: [Manage Redemption]
      operationId: getRedemptionBatch
      x-permission: platform:manage
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          $ref: "#/components/responses/ManageRedemptionBatch"
        "404":
          $ref: "#/components/responses/Error"
  /api/manage/redemption-batches/{batchId}/reveal:
    post:
      tags: [Manage Redemption]
      operationId: revealRedemptionBatch
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ManageGeneratedCodeList"
  /api/manage/redemption-batches/{batchId}/export:
    post:
      tags: [Manage Redemption]
      operationId: exportRedemptionBatch
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ManageRedemptionBatchExport"

  /api/manage/redemption-codes:
    get:
      tags: [Manage Redemption]
      operationId: listRedemptionCodes
      x-permission: platform:manage
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RedemptionCodeStatus"
        - name: batchId
          in: query
          schema: { type: string, format: uuid }
        - name: productCode
          in: query
          schema: { type: string }
        - name: redeemedBy
          in: query
          schema: { type: string }
        - name: expiringSoon
          in: query
          schema: { type: boolean }
      responses:
        "200":
          $ref: "#/components/responses/ManageRedemptionCodePage"
  /api/manage/redemption-codes/{codeId}:
    get:
      tags: [Manage Redemption]
      operationId: getRedemptionCode
      x-permission: platform:manage
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/CodeId"
      responses:
        "200":
          $ref: "#/components/responses/ManageRedemptionCodeDetail"
        "404":
          $ref: "#/components/responses/Error"
  /api/manage/redemption-codes/{codeId}/reveal:
    post:
      tags: [Manage Redemption]
      operationId: revealRedemptionCode
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/CodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ManageRedemptionCodeReveal"
  /api/manage/redemption-codes/disable:
    post:
      tags: [Manage Redemption]
      operationId: disableRedemptionCodes
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RedemptionCodesDisable"
      responses:
        "200":
          $ref: "#/components/responses/ManageBulkMutation"
  /api/manage/redemption-codes/extend:
    post:
      tags: [Manage Redemption]
      operationId: extendRedemptionCodes
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RedemptionCodesExtend"
      responses:
        "200":
          $ref: "#/components/responses/ManageBulkMutation"

  /api/manage/ai-providers:
    get:
      tags: [Manage AI]
      operationId: listAIProviders
      x-permission: platform:manage
      security:
        - adminSession: []
      responses:
        "200":
          $ref: "#/components/responses/ManageAIProviderList"
    post:
      tags: [Manage AI]
      operationId: createAIProvider
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AIProviderCreate"
      responses:
        "201":
          $ref: "#/components/responses/ManageAIProvider"
  /api/manage/ai-providers/{providerId}:
    patch:
      tags: [Manage AI]
      operationId: updateAIProvider
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AIProviderUpdate"
      responses:
        "200":
          $ref: "#/components/responses/ManageAIProvider"
    delete:
      tags: [Manage AI]
      operationId: deleteAIProvider
      description: 仅允许删除不含模型且未被平台绑定的服务商；历史任务快照不受影响。
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "409":
          $ref: "#/components/responses/Error"
  /api/manage/ai-providers/{providerId}/test:
    post:
      tags: [Manage AI]
      operationId: testAIProvider
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ManageAIProvider"
  /api/manage/ai-providers/{providerId}/rotate-key:
    post:
      tags: [Manage AI]
      operationId: rotateAIProviderKey
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/APIKeyRotate"
      responses:
        "200":
          $ref: "#/components/responses/ManageAIProvider"

  /api/manage/ai-models:
    get:
      tags: [Manage AI]
      operationId: listAIModels
      x-permission: platform:manage
      security:
        - adminSession: []
      parameters:
        - name: providerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          $ref: "#/components/responses/ManageAIModelList"
    post:
      tags: [Manage AI]
      operationId: createAIModel
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AIModelCreate"
      responses:
        "201":
          $ref: "#/components/responses/ManageAIModel"
  /api/manage/ai-models/{modelId}:
    patch:
      tags: [Manage AI]
      operationId: updateAIModel
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AIModelUpdate"
      responses:
        "200":
          $ref: "#/components/responses/ManageAIModel"
    delete:
      tags: [Manage AI]
      operationId: deleteAIModel
      description: 仅允许删除未承担平台绑定的模型；历史任务快照不受影响。
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "409":
          $ref: "#/components/responses/Error"
  /api/manage/ai-models/{modelId}/test:
    post:
      tags: [Manage AI]
      operationId: testAIModel
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ManageAIModel"
  /api/manage/platform-model-bindings:
    get:
      tags: [Manage AI]
      operationId: getPlatformModelBindings
      x-permission: platform:manage
      security:
        - adminSession: []
      responses:
        "200":
          $ref: "#/components/responses/ManagePlatformModelBindings"
    post:
      tags: [Manage AI]
      operationId: bindPlatformModel
      x-permission: platform:manage
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/PlatformModelBind"
      responses:
        "200":
          $ref: "#/components/responses/ManagePlatformModelBindings"
        "409":
          $ref: "#/components/responses/Error"

  /api/manage/users:
    get:
      tags: [Manage Users]
      operationId: listManagedUsers
      x-permission: platform:manage
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
      responses:
        "200":
