components:
  securitySchemes:
    userSession:
      type: apiKey
      in: cookie
      name: yy_user_session
    adminSession:
      type: apiKey
      in: cookie
      name: yy_manage_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: keyword
      in: query
      schema: { type: string, maxLength: 200 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CodeId:
      name: codeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderId:
      name: providerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelId:
      name: modelId
      in: path
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginInput"
    UserRegister:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterInput"
    GenerationQuote:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [action, outputCount]
            properties:
              action: { type: string, const: generate }
              outputCount: { type: integer, minimum: 1, maximum: 4 }
    RedemptionClaim:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: { type: string, minLength: 1, maxLength: 128 }
    PromptOptimize:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromptOptimizeInput"
    PromptConfirm:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromptConfirmInput"
    GenerationCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenerationCreateInput"
    RetouchCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RetouchCreateInput"
    RetouchQuoteAccept:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [quoteId]
            properties:
              quoteId: { type: string, format: uuid }
    RetouchRevision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string, minLength: 1, maxLength: 500 }
    RedemptionBatchCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RedemptionBatchCreateInput"
    RedemptionCodesDisable:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [codeIds, reason]
            properties:
              codeIds:
                type: array
                minItems: 1
                maxItems: 500
                uniqueItems: true
                items: { type: string, format: uuid }
              reason: { type: string, minLength: 1, maxLength: 500 }
    RedemptionCodesExtend:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [codeIds, expiresAt, reason]
            properties:
              codeIds:
                type: array
                minItems: 1
                maxItems: 500
                uniqueItems: true
                items: { type: string, format: uuid }
              expiresAt: { type: string, format: date-time }
              reason: { type: string, minLength: 1, maxLength: 500 }
    AIProviderCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AIProviderCreateInput"
    AIProviderUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AIProviderUpdateInput"
    APIKeyRotate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [apiKey]
            properties:
              apiKey: { type: string, minLength: 8, maxLength: 4096 }
    AIModelCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AIModelCreateInput"
    AIModelUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AIModelUpdateInput"
    PlatformModelBind:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [type, modelId]
            properties:
              type: { type: string, enum: [chat, image] }
              modelId:
                type: [string, "null"]
                format: uuid
    UserStatusUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status, reason]
            properties:
              status: { type: string, enum: [active, disabled] }
              reason: { type: string, minLength: 1, maxLength: 500 }
    CreditAdjustment:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [amount, reason]
            properties:
              amount:
                type: integer
                minimum: -100000
                maximum: 100000
                not: { const: 0 }
              reason: { type: string, minLength: 1, maxLength: 500 }
    AssetRetain:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [retained, reason]
            properties:
              retained: { type: boolean }
              reason: { type: string, minLength: 1, maxLength: 500 }
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 500 }
    RetouchQuote:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [credits]
            properties:
              credits: { type: integer, minimum: 1, maximum: 10000 }
              note: { type: string, maxLength: 500 }

  responses:
    Health:
      description: 进程或依赖健康
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, ready] }
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Empty:
      description: 成功，无业务数据
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptySuccess"
