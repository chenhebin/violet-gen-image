name: yingyan-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  APP_ENV: production
  GIN_MODE: release
  HTTP_ADDR: :8080
  ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_BUCKET: ${MINIO_BUCKET:-yingyan-assets}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  MINIO_USE_SSL: "false"
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  TOKEN_PEPPER: ${TOKEN_PEPPER:?TOKEN_PEPPER is required}
  REDEMPTION_PEPPER: ${REDEMPTION_PEPPER:?REDEMPTION_PEPPER is required}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  COOKIE_SECURE: "true"
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SAME_SITE: lax
  USER_SESSION_COOKIE: yy_user_session
  ADMIN_SESSION_COOKIE: yy_manage_session
  USER_SESSION_TTL: ${USER_SESSION_TTL:-24h}
  USER_REMEMBER_TTL: ${USER_REMEMBER_TTL:-720h}
  ADMIN_SESSION_TTL: ${ADMIN_SESSION_TTL:-8h}
  ADMIN_REMEMBER_TTL: ${ADMIN_REMEMBER_TTL:-168h}
  TERMS_VERSION: ${TERMS_VERSION:-v0.1}
  WORKER_HEALTH_ADDR: :8081
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
  WORKER_STALE_AFTER: ${WORKER_STALE_AFTER:-5m}
  PROVIDER_ALLOW_HTTP: "false"
  PROVIDER_ALLOW_PRIVATE_NETWORK: "false"
  PROVIDER_CONNECT_TIMEOUT: ${PROVIDER_CONNECT_TIMEOUT:-10s}
  PROVIDER_REQUEST_TIMEOUT: ${PROVIDER_REQUEST_TIMEOUT:-180s}
  PROVIDER_RESPONSE_HEADER_TIMEOUT: ${PROVIDER_RESPONSE_HEADER_TIMEOUT:-180s}
  ALLOW_ACCOUNT_SEED: "false"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yingyan
      POSTGRES_USER: yingyan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yingyan -d yingyan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        && mc anonymous set none "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-yingyan-assets}
    networks:
      - app
    restart: "no"
    logging: *default-logging

  migrate:
    profiles: ["tools"]
    image: ${BACKEND_IMAGE:-yingyan-backend}:${IMAGE_TAG:-latest}
    entrypoint: ["/app/migrate"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  seed:
    profiles: ["tools"]
    image: ${BACKEND_IMAGE:-yingyan-backend}:${IMAGE_TAG:-latest}
    entrypoint: ["/app/seed"]
    environment:
      <<: *backend-environment
      ALLOW_ACCOUNT_SEED: ${ALLOW_ACCOUNT_SEED:-false}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      CLIENT_USER_EMAIL: ${CLIENT_USER_EMAIL:-}
      CLIENT_USER_PASSWORD: ${CLIENT_USER_PASSWORD:-}
      RETOUCH_ADMIN_EMAIL: ${RETOUCH_ADMIN_EMAIL:-}
      RETOUCH_ADMIN_PASSWORD: ${RETOUCH_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  bootstrap-admin:
    profiles: ["tools"]
    image: ${BACKEND_IMAGE:-yingyan-backend}:${IMAGE_TAG:-latest}
    entrypoint: ["/app/bootstrap-admin"]
    environment:
      <<: *backend-environment
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-平台管理员}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    image: ${BACKEND_IMAGE:-yingyan-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    entrypoint: ["/app/api"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  worker:
    image: ${BACKEND_IMAGE:-yingyan-backend}:${IMAGE_TAG:-latest}
    entrypoint: ["/app/worker"]
    environment:
      <<: *backend-environment
      WORKER_ID: ${WORKER_ID:-yingyan-worker-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app
      - data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  admin:
    image: ${ADMIN_IMAGE:-yingyan-admin}:${IMAGE_TAG:-latest}
    build:
      context: ./front/server
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  client:
    image: ${CLIENT_IMAGE:-yingyan-client}:${IMAGE_TAG:-latest}
    build:
      context: ./front/client
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8088}:8080"
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  minio_data:
