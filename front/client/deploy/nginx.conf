map $http_x_forwarded_proto $yingyan_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 128m;
    client_body_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /mockServiceWorker.js {
        return 404;
    }

    location = /manage {
        return 308 /manage/;
    }

    location ^~ /manage/ {
        proxy_pass http://admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $yingyan_forwarded_proto;
    }

    location ^~ /manage-assets/ {
        proxy_pass http://admin:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 240s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $yingyan_forwarded_proto;
    }

    # MINIO_PUBLIC_ENDPOINT signs URLs with the public host and the bucket
    # path. Preserve the host, URI and query string exactly.
    location ^~ /yingyan-assets/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
